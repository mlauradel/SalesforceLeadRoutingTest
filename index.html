<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Test Form</title>
</head>
<body>

<h1>Lead Test Form</h1>

<!--
    BEFORE TESTING:
    1. Replace YOUR_ORG_ID_HERE with your Salesforce Org ID.
    2. This form uses Salesforce Web-to-Lead.
    3. The hidden Lead Source is intentionally hardcoded to "Web".
-->

<form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8"
      method="POST">

    <!-- Salesforce Org ID -->
    <input type="hidden" name="oid" value="YOUR_ORG_ID_HERE">

    <!-- Hidden Lead Source: intentionally hardcoded for this test -->
    <input type="hidden" name="lead_source" value="Web">

    <label for="first_name">First Name</label><br>
    <input type="text" id="first_name" name="first_name"><br><br>

    <label for="last_name">Last Name</label><br>
    <input type="text" id="last_name" name="last_name"><br><br>

    <label for="email">Work Email</label><br>
    <input type="email" id="email" name="email"><br><br>

    <label for="company">Company</label><br>
    <input type="text" id="company" name="company"><br><br>

    <label for="phone">Phone</label><br>
    <input type="tel" id="phone" name="phone"><br><br>

    <label for="state">State / Province</label><br>
    <input type="text" id="state" name="state"><br><br>

    <label for="description">Describe Your Current Discovery Pain</label><br>
    <textarea id="description" name="description" rows="6" cols="50"></textarea><br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
